[/Script/EngineSettings.GameMapsSettings]
; The game always boots into the main menu map, which is a level of its own.
EditorStartupMap=/Game/Maps/MainMenu.MainMenu
GameDefaultMap=/Game/Maps/MainMenu.MainMenu
ServerDefaultMap=/Game/Maps/FiringRange.FiringRange
TransitionMap=
GlobalDefaultGameMode=/Script/FiringRange.FRMenuGameMode
GlobalDefaultServerGameMode=/Script/FiringRange.FRMenuGameMode
GameInstanceClass=/Script/FiringRange.FRGameInstance

[/Script/Engine.Engine]
; Keeps the project independent from any Blueprint asset: every framework class
; used by the game is a native C++ class referenced by its script path.
GameViewportClientClassName=/Script/Engine.GameViewportClient

[/Script/Engine.RendererSettings]
; Anti aliasing that keeps thin geometry such as target frames readable.
r.AntiAliasingMethod=4
; Motion blur and auto exposure are disabled: both hurt aiming precision because
; they change how the impact point reads on screen.
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.Bloom=True
r.GenerateMeshDistanceFields=True
r.CustomDepth=3
; Software Lumen: good looking indirect lighting that still runs without
; hardware ray tracing, so the project stays usable on Linux and older GPUs.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Shadow.Virtual.Enable=1
r.DefaultFeature.LightUnits=1

[/Script/Engine.PhysicsSettings]
; Real world gravity, used by the ballistic solver of the projectiles.
DefaultGravityZ=-980.000000
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6
DefaultDegreesOfFreedom=Full

[/Script/Engine.CollisionProfile]
; The project deliberately sticks to the built in channels. Visibility is used
; for the crosshair trace, WorldDynamic for target boards, and projectiles are
; simulated physics bodies that block everything except their own instigator.

[/Script/Engine.AudioSettings]
DefaultSoundClassName=/Engine/EngineSounds/Master.Master
DefaultSoundConcurrencyName=/Engine/EngineSounds/DefaultSoundConcurrency.DefaultSoundConcurrency

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
